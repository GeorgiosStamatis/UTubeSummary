name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      APK_DIR: release/
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Cache Gradle packages
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Setup Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > release.jks
          echo "storeFile=release.jks" > keystore.properties
          echo "keyAlias=$KEY_ALIAS" >> keystore.properties
          echo "keyPassword=$KEY_PASSWORD" >> keystore.properties
          echo "storePassword=$STORE_PASSWORD" >> keystore.properties

      - name: Build release artifacts
        run: ./gradlew clean assembleRelease

      - name: Extract version info from tag
        id: extract-versions
        run: |
          set -e
          # Example: Extracting from a tag like v1.2.3(45)
          TAG_NAME=${GITHUB_REF#refs/tags/} # e.g., v1.2.3(45)
          VERSION_NAME=$(echo "$TAG_NAME" | sed -n 's/^v\([^(]*\).*$/\1/p') # Extracts 1.2.3
          VERSION_CODE=$(echo "$TAG_NAME" | sed -n 's/.*(\([0-9]*\)).*$/\1/p') # Extracts 45

          # Each value falls back to the gradle file on its own (a tag like v0.1.1 has no code)
          if [ -z "$VERSION_NAME" ]; then
            echo "Could not parse the version name from the tag, using build.gradle.kts"
            VERSION_NAME=$(grep -E 'versionName\s' app/build.gradle.kts | sed -n 's/.*versionName\s*=\s*["'\'']\([^"'\'']*\)["'\''].*/\1/p')
          fi
          if [ -z "$VERSION_CODE" ]; then
            echo "Could not parse the version code from the tag, using build.gradle.kts"
            VERSION_CODE=$(grep 'versionCode' app/build.gradle.kts | sed -n 's/.*versionCode\s*=\s*\([0-9]*\).*/\1/p')
          fi

          echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_ENV
          echo "VERSION_CODE=${VERSION_CODE}" >> $GITHUB_ENV
          echo "Tag: ${TAG_NAME}"
          echo "Version Name: ${VERSION_NAME}"
          echo "Version Code: ${VERSION_CODE}"

      - name: Build release notes
        run: .github/scripts/release-notes.sh "${GITHUB_REF#refs/tags/}" > release-notes.md

      - name: Create release folder
        run: mkdir -p ${{ env.APK_DIR }}

      - name: Copy and rename artifacts
        run: |
          cp "app/build/outputs/apk/gms/release/app-gms-release.apk" "${{ env.APK_DIR }}/UTubeSummary-gms-${{ env.VERSION_NAME }}(${{ env.VERSION_CODE }}).apk"
          cp "app/build/outputs/apk/standalone/release/app-standalone-release.apk" "${{ env.APK_DIR }}/UTubeSummary-standalone-${{ env.VERSION_NAME }}(${{ env.VERSION_CODE }}).apk"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: "Release ${{ env.VERSION_NAME }} (${{ env.VERSION_CODE }})"
          prerelease: false
          draft: false
          body_path: release-notes.md
          files: |
            ${{ env.APK_DIR }}/*.apk

